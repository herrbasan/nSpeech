<div class="page-chatterbox-generate">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Chatterbox — Generate</h1>
        <p class="lead">Zero-shot voice cloning TTS with per-sentence streaming.</p>
    </header>

    <nui-card>
        <nui-input-group>
            <label for="cb-voice">Voice</label>
            <nui-select id="voice-select">
                <select id="cb-voice">
                    <option value="default" selected>Select a cloned voice...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="cb-model">Model</label>
            <nui-select>
                <select id="cb-model">
                    <option value="turbo" selected>Turbo (350M, paralinguistic)</option>
                    <option value="eng">English (500M, exaggeration)</option>
                    <option value="mtl">Multilingual (500M, 23 languages)</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="cb-language">Language</label>
            <nui-select>
                <select id="cb-language">
                    <option value="en" selected>English</option>
                    <option value="de">German</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ru">Russian</option>
                    <option value="ar">Arabic</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="pt">Portuguese</option>
                    <option value="sv">Swedish</option>
                    <option value="tr">Turkish</option>
                    <option value="hi">Hindi</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="cb-text">Text</label>
            <nui-textarea auto-resize max-rows="8" min-rows="5">
                <textarea id="cb-text" placeholder="Text to synthesize...">This is a test of the Chatterbox streaming system. Zero-shot voice cloning allows the engine to reproduce any speaker from just a few seconds of reference audio.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button id="btn-arena-sample">
            <button type="button">Random Arena Sample</button>
        </nui-button>
        <p id="cb-arena-info" style="margin-top: var(--nui-space-half); color: var(--color-shade6); font-size: 0.85em;"></p>

        <nui-input-group>
            <label for="cb-exaggeration">Exaggeration: <span id="cb-exag-val">0.5</span></label>
            <nui-input>
                <input type="range" id="cb-exaggeration" min="0.0" max="1.0" step="0.05" value="0.5">
            </nui-input>
        </nui-input-group>

        <nui-input-group>
            <nui-input>
                <input type="checkbox" id="cb-batch">
                <label for="cb-batch">Batch mode (full render, no streaming — best quality)</label>
            </nui-input>
        </nui-input-group>

        <nui-button-container gap="medium" data-generate-anchor>
            <nui-button variant="primary" id="btn-generate">
                <button type="button">Generate</button>
            </nui-button>
        </nui-button-container>

    </nui-card>
</div>

<script type="nui/page">
const mountGenerate = window.nspeechMountGenerate;

function init(element, params, nui) {
    const voiceSelect = element.querySelector('#voice-select');
    const selectEl = element.querySelector('#cb-voice');
    const textArea = element.querySelector('#cb-text');
    const exaggerationEl = element.querySelector('#cb-exaggeration');
    const languageEl = element.querySelector('#cb-language');
    const modelEl = element.querySelector('#cb-model');
    const exagValEl = element.querySelector('#cb-exag-val');
    const arenaBtn = element.querySelector('#btn-arena-sample');
    const arenaInfo = element.querySelector('#cb-arena-info');
    const batchEl = element.querySelector('#cb-batch');
    const generateBtn = element.querySelector('#btn-generate');

    // Manual auto-resize fallback
    function autoResize(ta) {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
    }
    textArea.addEventListener('input', () => autoResize(textArea));
    autoResize(textArea);

    arenaBtn.addEventListener('nui-click', () => {
        fetch('/arena-samples')
            .then(r => r.json())
            .then(d => {
                if (d.text) {
                    textArea.value = d.text;
                    autoResize(textArea);
                    arenaInfo.textContent = `From: ${d.speaker} — "${d.topic}"`;
                }
            })
            .catch(() => {
                arenaInfo.textContent = 'No arena samples available.';
            });
    });

    function loadVoices() {
        window.nspeech.client.listVoices('chatterbox', null, true)
            .then(d => {
                const allVoices = d.voices || [];
                const cloned = allVoices
                    .filter(v => v.voice_type === 'cloned')
                    .map(v => ({ value: v.name, label: v.name }));
                const items = [{ value: 'default', label: 'Select a cloned voice...' }];
                if (cloned.length) items.push(...cloned);
                voiceSelect.setItems(items);
            })
            .catch(() => {});
    }

    // ── Generate via the shared widget (player + progress) ─────────────
    const widget = mountGenerate(element, {
        filename: 'chatterbox-speech.mp3',
        buildParams: () => {
            const text = textArea.value.trim();
            if (!text) return null;
            const eb = {
                expressiveness: parseFloat(exaggerationEl.value),
                language: languageEl.value || undefined,
                model: modelEl.value || undefined,
                batch: batchEl.checked,
            };
            return {
                model: 'chatterbox',
                input: text,
                voice: selectEl.value || 'default',
                extraBody: eb,
            };
        },
    });

    generateBtn.querySelector('button').addEventListener('click', () => widget.generate());

    exaggerationEl.addEventListener('input', () => {
        exagValEl.textContent = exaggerationEl.value;
    });

    element.show = () => loadVoices();
    element.hide = () => widget.stop();
}
</script>
