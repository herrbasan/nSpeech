<div class="page-home">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>nSpeech</h1>
        <p class="lead">High-speed streaming text-to-speech service.</p>
    </header>

    <section style="margin-bottom: var(--nui-space-double)">
        <h2 style="margin-top: 0">Engine Status</h2>
        <nui-card>
            <div id="engine-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--nui-space);">
            </div>
        </nui-card>
    </section>

    <section>
        <h2 style="margin-top: 0">Event Log</h2>
        <nui-card>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--nui-space-half);">
                <span id="event-status" style="color: var(--text-color-dim); font-size: 0.85em;">Connecting...</span>
                <nui-button variant="ghost" id="btn-clear-log">
                    <button type="button">Clear</button>
                </nui-button>
            </div>
            <div id="event-log" style="font-family: monospace; font-size: 0.82em; max-height: 400px; overflow-y: auto; background: var(--color-shade2); padding: var(--nui-space); border-radius: var(--border-radius1); border: 1px solid var(--border-shade1);">
            </div>
        </nui-card>
    </section>
</div>

<script type="nui/page">
function init(element, params, nui) {
    const gridEl = element.querySelector('#engine-grid');
    const logEl = element.querySelector('#event-log');
    const statusEl = element.querySelector('#event-status');
    const clearBtn = element.querySelector('#btn-clear-log');

    const TYPE_COLORS = {
        engine:  'var(--color-highlight)',
        worker:  'var(--color-success)',
        error:   'var(--color-danger)',
        system:  'var(--text-color-dim)',
        request: 'var(--text-color-dim)',
    };

    let eventSource = null;

    function renderEngineGrid(engines, current) {
        gridEl.innerHTML = '';
        engines.forEach(eng => {
            const card = document.createElement('div');
            card.style.cssText = 'padding: var(--nui-space-half); border-radius: var(--border-radius1); border: 1px solid var(--border-shade1);';

            const isCurrent = eng.name === current;
            const stateColor = eng.is_loaded ? 'var(--color-success)' :
                               (eng.venv_exists === false && !eng.type) ? 'var(--color-danger)' :
                               'var(--text-color-dim)';

            const stateLabel = eng.type === 'cloud'
                ? (eng.health === 'ready' ? 'cloud' : eng.health || 'cloud')
                : (eng.is_loaded ? 'loaded' :
                   (eng.venv_exists === false ? 'not installed' : 'idle'));

            card.innerHTML = `
                <div style="font-weight: ${isCurrent ? 'bold' : 'normal'}; color: ${isCurrent ? 'var(--color-highlight)' : 'var(--text-color)'};">
                    ${eng.name}${eng.gpu ? ' 🎮' : ''}${eng.type === 'cloud' ? ' ☁' : ''}
                </div>
                <div style="font-size: 0.8em; color: ${stateColor};">
                    ${isCurrent ? '● active · ' : ''}${stateLabel}
                </div>
            `;
            gridEl.appendChild(card);
        });
    }

    function loadEngineStatus() {
        fetch('/v1/admin/engines')
            .then(r => r.json())
            .then(d => {
                renderEngineGrid(d.engines, d.current);
            })
            .catch(() => {
                gridEl.innerHTML = '<p style="color: var(--color-danger)">Failed to load engine status.</p>';
            });
    }

    function appendEvent(event) {
        const time = new Date(event.ts).toLocaleTimeString();
        const color = TYPE_COLORS[event.type] || 'var(--text-color)';
        const row = document.createElement('div');
        row.style.cssText = `color: ${color}; padding: 2px 0; border-bottom: 1px solid var(--color-shade1);`;
        row.innerHTML = `<span style="color: var(--text-color-dim);">[${time}]</span> <span style="font-weight: bold; text-transform: uppercase; font-size: 0.85em;">${event.type}</span> ${event.message}`;
        logEl.appendChild(row);
        logEl.scrollTop = logEl.scrollHeight;

        // Keep max 500 rows
        while (logEl.children.length > 500) {
            logEl.removeChild(logEl.firstChild);
        }

        // Refresh engine grid on engine/worker events
        if (event.type === 'engine' || event.type === 'worker' || event.type === 'system') {
            loadEngineStatus();
        }
    }

    function connectEventStream() {
        if (eventSource) eventSource.close();

        eventSource = new EventSource('/v1/admin/events');

        eventSource.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.style.color = 'var(--color-success)';
        };

        eventSource.onmessage = (e) => {
            try {
                const event = JSON.parse(e.data);
                appendEvent(event);
            } catch (_) { /* ignore parse errors */ }
        };

        eventSource.onerror = () => {
            statusEl.textContent = 'Reconnecting...';
            statusEl.style.color = 'var(--color-danger)';
            eventSource.close();
            setTimeout(connectEventStream, 3000);
        };
    }

    clearBtn.addEventListener('click', () => {
        logEl.innerHTML = '';
    });

    element.show = () => {
        loadEngineStatus();
        connectEventStream();
    };

    element.hide = () => {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
    };

    element.show();
}
</script>
