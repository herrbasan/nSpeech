<div class="page-gemini-voices">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Gemini — Voices</h1>
        <p class="lead">30 static named voices plus voice presets (voice + instructions combinations).</p>
    </header>

    <nui-card>
        <h3 style="margin-top: 0">Available Voices</h3>
        <div id="gem-voice-list"><p style="color: var(--color-shade6)">Loading...</p></div>
    </nui-card>

    <nui-card>
        <h3 style="margin-top: 0">Voice Presets</h3>
        <p class="lead" style="margin-bottom: var(--nui-space)">Combine a voice with instructions to create a reusable character preset.</p>

        <nui-input-group>
            <label for="preset-name">Preset Name</label>
            <nui-input>
                <input type="text" id="preset-name" placeholder="Smart Lady">
            </nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="preset-id">ID (URL-safe slug)</label>
            <nui-input>
                <input type="text" id="preset-id" placeholder="smart-lady">
            </nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="preset-voice">Base Voice</label>
            <nui-select>
                <select id="preset-voice"></select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="preset-instructions">Instructions</label>
            <nui-textarea min-rows="2" max-rows="4">
                <textarea id="preset-instructions" placeholder="Speak in the cadence of a public intellectual."></textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button variant="primary" id="btn-save-preset">
            <button type="button">Save Preset</button>
        </nui-button>

        <div id="preset-status" style="margin-top: var(--nui-space);"></div>

        <div id="preset-list" style="margin-top: var(--nui-space-double);"></div>
    </nui-card>
</div>

<script type="nui/page">
function init(element, params, nui) {
    var ENGINE = 'gemini';
    var listEl = element.querySelector('#gem-voice-list');
    var presetListEl = element.querySelector('#preset-list');
    var statusEl = element.querySelector('#preset-status');
    var voiceSelect = element.querySelector('#preset-voice');
    var nameInput = element.querySelector('#preset-name');
    var idInput = element.querySelector('#preset-id');
    var instructionsInput = element.querySelector('#preset-instructions');
    var allVoices = [];

    function loadVoices() {
        fetch('/v1/voices?engine=' + ENGINE)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                allVoices = d.voices || [];
                renderVoiceList();
                populateVoiceDropdown();
                loadPresets();
            })
            .catch(function(err) {
                listEl.innerHTML = '<p style="color:var(--color-danger)">Failed: ' + err.message + '</p>';
            });
    }

    function renderVoiceList() {
        if (!allVoices.length) {
            listEl.innerHTML = '<p style="color: var(--color-shade6)">No voices found.</p>';
            return;
        }
        var html = '<div style="display: grid; gap: var(--nui-space);">';
        for (var i = 0; i < allVoices.length; i++) {
            var v = allVoices[i];
            var typeLabel = v.voice_type === 'preset'
                ? '<span style="color:var(--color-highlight);font-size:0.8em;">preset</span>'
                : '';
            var desc = v.voice_type === 'preset'
                ? '<br><span style="color:var(--color-shade6);font-size:0.85em;">base: <code>' + v.base_voice + '</code>' + (v.instructions ? ' \u2014 ' + v.instructions.slice(0, 60) + '\u2026' : '') + '</span>'
                : '';
            html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:var(--nui-space-half) 0;border-bottom:1px solid var(--border-shade1-4);">' +
                '<span class="lead"><strong>' + v.name + '</strong> ' + typeLabel + desc + '</span>' +
                '<code style="font-size:0.85em;">' + v.voice_id + '</code>' +
                '</div>';
        }
        html += '</div>';
        listEl.innerHTML = html;
    }

    function populateVoiceDropdown() {
        voiceSelect.innerHTML = '<option value="" disabled selected>Select a base voice...</option>';
        for (var i = 0; i < allVoices.length; i++) {
            if (allVoices[i].voice_type === 'builtin') {
                var opt = document.createElement('option');
                opt.value = allVoices[i].voice_id;
                opt.textContent = allVoices[i].name;
                voiceSelect.appendChild(opt);
            }
        }
    }

    function loadPresets() {
        var presets = allVoices.filter(function(v) { return v.voice_type === 'preset'; });
        if (!presets.length) {
            presetListEl.innerHTML = '<p style="color: var(--color-shade6);">No presets yet.</p>';
            return;
        }
        var html = '<div style="display: grid; gap: var(--nui-space-half);">';
        for (var i = 0; i < presets.length; i++) {
            var p = presets[i];
            html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--nui-space-half);border:1px solid var(--border-shade1-4);border-radius:var(--border-radius1-3);">' +
                '<div><strong>' + p.name + '</strong> <code style="font-size:0.85em;">' + p.voice_id + '</code><br>' +
                '<span style="color:var(--color-shade6);font-size:0.85em;">voice: <code>' + p.base_voice + '</code>' + (p.instructions ? ' \u2014 ' + p.instructions.slice(0, 50) + '\u2026' : '') + '</span></div>' +
                '<nui-button variant="danger" data-delete="' + p.voice_id + '"><button type="button">Delete</button></nui-button>' +
                '</div>';
        }
        html += '</div>';
        presetListEl.innerHTML = html;

        var deleteBtns = presetListEl.querySelectorAll('[data-delete]');
        for (var d = 0; d < deleteBtns.length; d++) {
            (function(id) {
                deleteBtns[d].querySelector('button').addEventListener('click', function() { deletePreset(id); });
            })(deleteBtns[d].dataset.delete);
        }
    }

    function deletePreset(id) {
        fetch('/v1/voices/' + id + '?engine=' + ENGINE, { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function() {
                statusEl.innerHTML = '<span style="color:var(--color-highlight);">Preset deleted.</span>';
                loadVoices();
            })
            .catch(function(err) {
                statusEl.innerHTML = '<span style="color:var(--color-danger);">Delete failed: ' + err.message + '</span>';
            });
    }

    function savePreset() {
        var id = idInput.value.trim();
        var name = nameInput.value.trim();
        var voice = voiceSelect.value;
        var instructions = instructionsInput.value.trim();

        if (!name || !id || !voice) {
            statusEl.innerHTML = '<span style="color:var(--color-danger);">Name, ID, and base voice are required.</span>';
            return;
        }

        statusEl.innerHTML = '<span style="color:var(--color-shade6);">Saving...</span>';

        fetch('/v1/voices/preset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ engine: ENGINE, id: id, name: name, voice: voice, instructions: instructions }),
        })
            .then(function(r) { return r.json(); })
            .then(function() {
                statusEl.innerHTML = '<span style="color:var(--color-highlight);">Preset saved!</span>';
                nameInput.value = '';
                idInput.value = '';
                instructionsInput.value = '';
                voiceSelect.selectedIndex = 0;
                loadVoices();
            })
            .catch(function(err) {
                statusEl.innerHTML = '<span style="color:var(--color-danger);">Save failed: ' + err.message + '</span>';
            });
    }

    element.querySelector('#btn-save-preset button').addEventListener('click', savePreset);
    element.show = function() { loadVoices(); };
}
</script>
