<div class="page-f5tts-voices">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>F5-TTS â€” Voices</h1>
        <p class="lead">Clone a voice from 5-15s reference audio. F5-TTS needs an accurate transcript of the reference audio â€” quality depends on it.</p>
    </header>

    <nui-card>
        <h3 style="margin-top: 0">Clone Voice</h3>

        <nui-input-group>
            <label for="f5-clone-file">Reference Audio (.wav, .mp3, .flac, .ogg, .m4a)</label>
            <nui-input>
                <input type="file" id="f5-clone-file" accept=".wav,.mp3,.flac,.ogg,.m4a">
            </nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="f5-clone-name">Voice Name</label>
            <nui-input>
                <input type="text" id="f5-clone-name" placeholder="my_voice">
            </nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="f5-prompt-text">Reference Transcript</label>
            <nui-textarea auto-resize max-rows="4" min-rows="2">
                <textarea id="f5-prompt-text" placeholder="Exact transcript of the reference audio (leave empty to auto-transcribe)"></textarea>
            </nui-textarea>
            <p style="color: var(--color-shade6); font-size: 0.85em; margin-top: var(--nui-space-quarter);">Exact words spoken in the reference audio. If empty, the STT worker transcribes it automatically.</p>
        </nui-input-group>

        <nui-input-group>
            <label for="f5-test-phrase">Test Phrase</label>
            <nui-textarea auto-resize max-rows="4" min-rows="2">
                <textarea id="f5-test-phrase">This is a preview of the cloned voice. The quick brown fox jumps over the lazy dog. How does it sound to you?</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button id="btn-arena-sample">
            <button type="button">Random Arena Sample</button>
        </nui-button>
        <p id="f5-arena-info" style="margin-top: var(--nui-space-half); color: var(--color-shade6); font-size: 0.85em;"></p>

        <nui-button-container gap="medium">
            <nui-button variant="primary" id="btn-preview">
                <button type="button">Preview</button>
            </nui-button>
            <nui-button id="btn-save">
                <button type="button">Save Voice</button>
            </nui-button>
        </nui-button-container>

        <audio id="f5-preview-audio" controls style="width: 100%; margin-top: var(--nui-space); display: none;"></audio>
        <div id="f5-status" style="margin-top: var(--nui-space);"></div>
    </nui-card>

    <nui-card>
        <h3 style="margin-top: 0">Voices</h3>
        <nui-tabs>
            <nav>
                <button>Saved</button>
                <button>Previews</button>
            </nav>
            <section><div id="f5-saved-list"><p style="color: var(--color-shade6)">Loading...</p></div></section>
            <section hidden><div id="f5-preview-list"><p style="color: var(--color-shade6)">No previews yet.</p></div></section>
        </nui-tabs>
    </nui-card>
</div>

<script type="nui/page">
function init(element, params, nui) {
    const fileInput = element.querySelector('#f5-clone-file');
    const nameInput = element.querySelector('#f5-clone-name');
    const promptTextEl = element.querySelector('#f5-prompt-text');
    const testPhraseEl = element.querySelector('#f5-test-phrase');
    const arenaBtn = element.querySelector('#btn-arena-sample');
    const arenaInfo = element.querySelector('#f5-arena-info');
    const btnPreview = element.querySelector('#btn-preview');
    const btnSave = element.querySelector('#btn-save');
    const statusEl = element.querySelector('#f5-status');
    const savedListEl = element.querySelector('#f5-saved-list');
    const previewListEl = element.querySelector('#f5-preview-list');
    const previewAudio = element.querySelector('#f5-preview-audio');

    function autoResize(ta) {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
    }
    testPhraseEl.addEventListener('input', () => autoResize(testPhraseEl));
    promptTextEl.addEventListener('input', () => autoResize(promptTextEl));
    autoResize(testPhraseEl);

    arenaBtn.addEventListener('nui-click', () => {
        fetch('/arena-samples')
            .then(r => r.json())
            .then(d => {
                if (d.text) {
                    testPhraseEl.value = d.text;
                    autoResize(testPhraseEl);
                    arenaInfo.textContent = `From: ${d.speaker} â€” "${d.topic}"`;
                }
            })
            .catch(() => {
                arenaInfo.textContent = 'No arena samples available.';
            });
    });

    let mediaSource = null;
    let abortController = null;

    function buildVoiceRow(name, isPreview) {
        const row = document.createElement('div');
        row.style.cssText = 'display: flex; align-items: center; justify-content: space-between; padding: var(--nui-space-half) 0; border-bottom: 1px solid var(--color-shade2);';
        const label = document.createElement('span');
        label.textContent = name;
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', async () => {
            await fetch(`/v1/voices/${encodeURIComponent(name)}?engine=f5tts-german`, { method: 'DELETE' });
            loadVoices();
        });
        row.appendChild(label);
        row.appendChild(delBtn);
        return row;
    }

    function loadVoices() {
        fetch('/v1/voices?engine=f5tts-german')
            .then(r => r.json())
            .then(d => {
                const voices = d.voices || [];
                const cloned = voices.filter(v => v.voice_type === 'cloned' || v.voice_type === 'blended');
                const previews = voices.filter(v => v.voice_type === 'preview');

                if (cloned.length === 0) {
                    savedListEl.innerHTML = '<p style="color: var(--color-shade6)">No saved voices yet.</p>';
                } else {
                    savedListEl.innerHTML = '';
                    cloned.forEach(v => savedListEl.appendChild(buildVoiceRow(v.name, false)));
                }

                if (previews.length === 0) {
                    previewListEl.innerHTML = '<p style="color: var(--color-shade6)">No previews yet.</p>';
                } else {
                    previewListEl.innerHTML = '';
                    previews.forEach(v => previewListEl.appendChild(buildVoiceRow(v.name, true)));
                }
            })
            .catch(() => {
                savedListEl.innerHTML = '<p style="color: var(--color-danger)">Failed to load voices.</p>';
            });
    }

    function stopPreview() {
        if (abortController) { abortController.abort(); abortController = null; }
        previewAudio.pause();
        if (mediaSource?.readyState === 'open') try { mediaSource.endOfStream(); } catch (_) {}
        mediaSource = null;
    }

    btnPreview.querySelector('button').addEventListener('click', () => {
        const file = fileInput.files?.[0];
        if (!file) { statusEl.innerHTML = '<nui-badge variant="danger">Select a .wav file first.</nui-badge>'; return; }
        stopPreview();

        abortController = new AbortController();
        statusEl.innerHTML = '<nui-progress type="busy"></nui-progress> Previewing...';

        const formData = new FormData();
        formData.append('audio', file);
        formData.append('test_phrase', testPhraseEl.value || 'This is a preview of the cloned voice.');
        if (promptTextEl.value.trim()) formData.append('prompt_text', promptTextEl.value.trim());

        previewAudio.style.display = 'block';
        mediaSource = new MediaSource();
        previewAudio.src = URL.createObjectURL(mediaSource);

        let firstChunk = false;
        const startTime = performance.now();

        mediaSource.addEventListener('sourceopen', async () => {
            const sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
            try {
                const res = await fetch('/v1/voices/preview?engine=f5tts-german', { method: 'POST', body: formData, signal: abortController.signal });
                if (!res.ok) {
                    const rawText = await res.text();
                    let msg = rawText.slice(0, 500);
                    try {
                        const parsed = JSON.parse(rawText);
                        msg = parsed.detail || parsed.error?.message || msg;
                    } catch (_) { /* not JSON, keep raw text */ }
                    statusEl.innerHTML = `<nui-badge variant="danger">${msg}</nui-badge>`;
                    return;
                }
                const transcript = res.headers.get('x-stt-transcript');
                const reader = res.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (!firstChunk && value?.length) {
                        firstChunk = true;
                        statusEl.innerHTML = `TTFB: ${(performance.now() - startTime).toFixed(0)}ms`;
                    }
                    await new Promise((res, rej) => {
                        sourceBuffer.appendBuffer(value);
                        sourceBuffer.onupdateend = res;
                        sourceBuffer.onerror = rej;
                    });
                    if (previewAudio.paused && sourceBuffer.buffered.length > 0) {
                        previewAudio.play().catch(() => {});
                    }
                }
                if (mediaSource.readyState === 'open') mediaSource.endOfStream();
                let doneMsg = `Done (${(performance.now() - startTime).toFixed(0)}ms)`;
                if (transcript) {
                    doneMsg += `<br><span style="color: var(--color-shade6); font-size: 0.85em;">Transcript: "${transcript.slice(0, 150)}${transcript.length > 150 ? 'â€¦' : ''}"</span>`;
                }
                statusEl.innerHTML = doneMsg;
            } catch (e) {
                if (e.name === 'AbortError') { statusEl.innerHTML = 'Stopped.'; }
                else { statusEl.innerHTML = `<nui-badge variant="danger">Error: ${e}</nui-badge>`; }
            }
        }, { once: true });
    });

    btnSave.addEventListener('nui-click', async () => {
        const file = fileInput.files?.[0];
        if (!file) { statusEl.innerHTML = '<nui-badge variant="danger">Select a .wav file first.</nui-badge>'; return; }
        const name = nameInput.value.trim();
        if (!name) { statusEl.innerHTML = '<nui-badge variant="danger">Provide a name for the voice.</nui-badge>'; return; }

        statusEl.innerHTML = '<nui-progress type="busy"></nui-progress> Saving...';

        const formData = new FormData();
        formData.append('audio', file);
        formData.append('name', name);
        if (promptTextEl.value.trim()) formData.append('prompt_text', promptTextEl.value.trim());

        try {
            const res = await fetch('/v1/voices/clone?engine=f5tts-german', { method: 'POST', body: formData });
            const result = await res.json();
            if (res.ok) {
                let msg = `Voice "${name}" saved (${result.clone_time_ms}ms).`;
                if (result.prompt_text) {
                    msg += `<br><span style="color: var(--color-shade6); font-size: 0.85em;">Transcript: "${result.prompt_text.slice(0, 150)}${result.prompt_text.length > 150 ? 'â€¦' : ''}"</span>`;
                }
                statusEl.innerHTML = `<nui-badge variant="success">${msg}</nui-badge>`;
                nameInput.value = '';
                fileInput.value = '';
                loadVoices();
            } else {
                statusEl.innerHTML = `<nui-badge variant="danger">${result.detail || 'Save failed'}</nui-badge>`;
            }
        } catch (e) {
            statusEl.innerHTML = `<nui-badge variant="danger">Error: ${e}</nui-badge>`;
        }
    });

    element.show = () => loadVoices();
    element.hide = () => stopPreview();
}
</script>
