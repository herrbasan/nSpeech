<div class="page-kokoro-generate">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Kokoro — Generate</h1>
        <p class="lead">Fast English TTS with 54 built-in voices.</p>
    </header>

    <nui-card>
        <nui-input-group>
            <label for="kok-voice">Voice</label>
            <nui-select id="voice-select">
                <select id="kok-voice">
                    <option value="" disabled selected>Loading voices...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="kok-text">Text</label>
            <nui-textarea auto-resize max-rows="8" min-rows="5">
                <textarea id="kok-text" placeholder="Text to synthesize...">This is a test of the nSpeech streaming system. As you can hear, the audio begins playing almost instantly. The system generates chunks sentence by sentence, achieving incredibly low latency.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button-container gap="medium" data-generate-anchor>
            <nui-button variant="primary" id="btn-generate">
                <button type="button">Generate</button>
            </nui-button>
        </nui-button-container>

    </nui-card>
</div>

<script type="nui/page">
const mountGenerate = window.nspeechMountGenerate;

// Kokoro voice quality tiers (from hexgrad voice metadata, exposed by the
// worker as `tier` A/B/C/D + `grade`). Grouping makes the tiers actionable:
// Premium voices surface first, low-quality ones sink.
const TIER_LABELS = { A: 'Premium', B: 'Standard', C: 'Basic', D: 'Low' };
const TIER_ORDER = ['A', 'B', 'C', 'D'];
const GRADE_RANK = { 'A': 0, 'A-': 1, 'B+': 2, 'B': 3, 'B-': 4, 'C+': 5, 'C': 6, 'C-': 7, 'D+': 8, 'D': 9, 'D-': 10, 'F+': 11 };

function groupByTier(voices) {
    const groups = [];
    for (const tier of TIER_ORDER) {
        const inTier = voices
            .filter(v => v.tier === tier)
            .sort((a, b) => (GRADE_RANK[a.grade] ?? 99) - (GRADE_RANK[b.grade] ?? 99));
        if (inTier.length) {
            groups.push({
                group: TIER_LABELS[tier] + ' (' + tier + ')',
                options: inTier.map(v => ({ value: v.name, label: v.name + ' · ' + (v.grade || '?') }))
            });
        }
    }
    const ungraded = voices.filter(v => !TIER_ORDER.includes(v.tier));
    if (ungraded.length) groups.push({ group: 'Ungraded', options: ungraded.map(v => ({ value: v.name, label: v.name })) });
    return groups;
}

function init(element, params, nui) {
    const voiceSelect = element.querySelector('#voice-select');
    const selectEl = element.querySelector('#kok-voice');
    const textArea = element.querySelector('#kok-text');
    const generateBtn = element.querySelector('#btn-generate');

    function loadVoices() {
        window.nspeech.client.listVoices('kokoro', null, true)
            .then(d => {
                const allVoices = d.voices || [];
                const builtins = allVoices.filter(v => v.voice_type === 'builtin');
                const blended = allVoices.filter(v => v.voice_type === 'blended').map(v => ({ value: v.name, label: v.name }));
                const groups = [];
                if (blended.length) groups.push({ group: 'Blended', options: blended });
                groups.push(...groupByTier(builtins));
                voiceSelect.setItems(groups);
            })
            .catch(() => {});
    }

    // ── Generate via the shared widget (player + progress) ─────────────
    const widget = mountGenerate(element, {
        filename: 'kokoro-speech.mp3',
        buildParams: () => {
            const text = textArea.value.trim();
            if (!text) return null;
            return {
                model: 'kokoro',
                input: text,
                voice: selectEl.value || 'default',
            };
        },
    });

    generateBtn.querySelector('button').addEventListener('click', () => widget.generate());

    element.show = () => loadVoices();
    element.hide = () => widget.stop();
}
</script>
