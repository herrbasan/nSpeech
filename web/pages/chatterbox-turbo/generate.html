<div class="page-chatterbox-turbo-generate">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Chatterbox Turbo — Generate</h1>
        <p class="lead">350M model. English with paralinguistic tags like [laugh][cough]. Fastest inference.</p>
    </header>

    <nui-card>
        <nui-input-group>
            <label for="cb-voice">Voice</label>
            <nui-select id="voice-select">
                <select id="cb-voice">
                    <option value="default" selected>Select a cloned voice...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="cb-text">Text</label>
            <nui-textarea auto-resize max-rows="8" min-rows="5">
                <textarea id="cb-text" placeholder="Text to synthesize...">This is a test of the Chatterbox Turbo system. Zero-shot voice cloning allows the engine to reproduce any speaker from just a few seconds of reference audio.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button id="btn-arena-sample">
            <button type="button">Random Arena Sample</button>
        </nui-button>
        <p id="cb-arena-info" style="margin-top: var(--nui-space-half); color: var(--color-shade6); font-size: 0.85em;"></p>

        <nui-input-group>
            <nui-input>
                <input type="checkbox" id="cb-batch">
                <label for="cb-batch">Batch mode (full render, no streaming — best quality)</label>
            </nui-input>
        </nui-input-group>

        <nui-button-container gap="medium">
            <nui-button variant="primary" id="btn-generate">
                <button type="button">Generate</button>
            </nui-button>
            <nui-button id="btn-stop">
                <button type="button">Stop</button>
            </nui-button>
        </nui-button-container>

        <audio id="cb-audio" controls style="width: 100%; margin-top: var(--nui-space-double); display: none;"></audio>
        <p id="cb-status" style="margin-top: var(--nui-space); color: var(--color-shade6);"></p>
    </nui-card>
</div>

<script type="nui/page">
function init(element, params, nui) {
    let mediaSource = null;
    let abortController = null;

    const voiceSelect = element.querySelector('#voice-select');
    const selectEl = element.querySelector('#cb-voice');
    const textArea = element.querySelector('#cb-text');
    const arenaBtn = element.querySelector('#btn-arena-sample');
    const arenaInfo = element.querySelector('#cb-arena-info');
    const batchEl = element.querySelector('#cb-batch');
    const generateBtn = element.querySelector('#btn-generate');
    const stopBtn = element.querySelector('#btn-stop');

    function autoResize(ta) {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
    }
    textArea.addEventListener('input', () => autoResize(textArea));
    autoResize(textArea);
    const audio = element.querySelector('#cb-audio');
    const statusEl = element.querySelector('#cb-status');

    arenaBtn.addEventListener('nui-click', () => {
        fetch('/arena-samples')
            .then(r => r.json())
            .then(d => {
                if (d.text) {
                    textArea.value = d.text;
                    autoResize(textArea);
                    arenaInfo.textContent = `From: ${d.speaker} — "${d.topic}"`;
                }
            })
            .catch(() => {
                arenaInfo.textContent = 'No arena samples available.';
            });
    });

    function loadVoices() {
        fetch('/v1/voices?engine=chatterbox-turbo')
            .then(r => r.json())
            .then(d => {
                const allVoices = d.voices || [];
                const cloned = allVoices
                    .filter(v => v.voice_type === 'cloned')
                    .map(v => ({ value: v.name, label: v.name }));
                const items = [{ value: 'default', label: 'Select a cloned voice...' }];
                if (cloned.length) items.push(...cloned);
                voiceSelect.setItems(items);
            })
            .catch(() => {
                statusEl.textContent = 'Failed to load voices';
            });
    }

    function stop() {
        if (abortController) {
            abortController.abort();
            abortController = null;
        }
        audio.pause();
        if (mediaSource?.readyState === 'open') try { mediaSource.endOfStream(); } catch (_) {}
        mediaSource = null;
        statusEl.textContent = '';
    }

    stopBtn.addEventListener('click', stop);

    generateBtn.querySelector('button').addEventListener('click', () => {
        const text = textArea.value.trim();
        if (!text) return;
        stop();

        const voice = selectEl.value || 'default';
        abortController = new AbortController();
        const startTime = performance.now();

        audio.style.display = 'block';
        mediaSource = new MediaSource();
        audio.src = URL.createObjectURL(mediaSource);

        let firstChunk = false;

        mediaSource.addEventListener('sourceopen', async () => {
            const sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
            statusEl.textContent = 'Buffering...';

            const body = {
                input: text,
                voice: voice,
                response_format: 'mp3',
                extra_body: {
                    batch: batchEl.checked,
                },
            };

            try {
                const response = await fetch('/v1/audio/speech', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: abortController.signal,
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const reader = response.body.getReader();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (!firstChunk && value?.length) {
                        firstChunk = true;
                        statusEl.textContent = `TTFB: ${(performance.now() - startTime).toFixed(0)}ms`;
                    }
                    await new Promise((res, rej) => {
                        sourceBuffer.appendBuffer(value);
                        sourceBuffer.onupdateend = res;
                        sourceBuffer.onerror = rej;
                    });
                    if (audio.paused && sourceBuffer.buffered.length > 0) {
                        audio.play().catch(() => {});
                    }
                }
                if (mediaSource.readyState === 'open') mediaSource.endOfStream();
                statusEl.textContent = `Done in ${(performance.now() - startTime).toFixed(0)}ms`;
            } catch (err) {
                if (err.name === 'AbortError') {
                    statusEl.textContent = 'Stopped.';
                } else {
                    statusEl.textContent = `Error: ${err.message}`;
                }
            }
        }, { once: true });
    });

    element.show = () => loadVoices();
    element.hide = () => stop();
}
</script>
