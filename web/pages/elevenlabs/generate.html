<div class="page-elevenlabs-generate">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>ElevenLabs — Generate</h1>
        <p class="lead">Cloud TTS with 10,000+ voices across 29 languages. <code>eleven_v3</code> by default.</p>
    </header>

    <nui-card>
        <nui-input-group>
            <label for="el-voice">Voice</label>
            <nui-select id="el-voice-select">
                <select id="el-voice">
                    <option value="" disabled selected>Loading voices...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="el-model">Model</label>
            <nui-select>
                <select id="el-model">
                    <option value="eleven_v3" selected>Eleven v3</option>
                    <option value="eleven_turbo_v2_5">Eleven Turbo v2.5</option>
                    <option value="eleven_multilingual_v2">Eleven Multilingual v2</option>
                    <option value="eleven_flash_v2_5">Eleven Flash v2.5</option>
                    <option value="eleven_turbo_v2">Eleven Turbo v2</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="el-text">Text</label>
            <nui-textarea auto-resize max-rows="8" min-rows="5">
                <textarea id="el-text" placeholder="Text to synthesize...">The first move is what sets everything in motion. This is a test of ElevenLabs cloud speech synthesis through nSpeech.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-input-group>
            <label for="el-stability">Stability</label>
            <nui-input type="range" min="0" max="1" step="0.05" value="0.5">
                <input type="range" id="el-stability" min="0" max="1" step="0.05" value="0.5">
            </nui-input>
            <span id="el-stability-val" style="margin-left: var(--nui-space-half)">0.50</span>
            <span style="color: var(--color-shade6); font-size: 0.85em; margin-left: var(--nui-space)">Lower = more expressive</span>
        </nui-input-group>

        <nui-input-group>
            <label for="el-style">Style Exaggeration</label>
            <nui-input type="range" min="0" max="1" step="0.05" value="0">
                <input type="range" id="el-style" min="0" max="1" step="0.05" value="0">
            </nui-input>
            <span id="el-style-val" style="margin-left: var(--nui-space-half)">0.00</span>
            <span style="color: var(--color-shade6); font-size: 0.85em; margin-left: var(--nui-space)">Amplifies voice character</span>
        </nui-input-group>

        <nui-input-group>
            <label for="el-similarity">Voice Similarity</label>
            <nui-input type="range" min="0" max="1" step="0.05" value="0.75">
                <input type="range" id="el-similarity" min="0" max="1" step="0.05" value="0.75">
            </nui-input>
            <span id="el-similarity-val" style="margin-left: var(--nui-space-half)">0.75</span>
            <span style="color: var(--color-shade6); font-size: 0.85em; margin-left: var(--nui-space)">Stick to original voice</span>
        </nui-input-group>

        <nui-input-group>
            <label for="el-speed">Speed</label>
            <nui-input type="range" min="0.7" max="1.2" step="0.05" value="1">
                <input type="range" id="el-speed" min="0.7" max="1.2" step="0.05" value="1">
            </nui-input>
            <span id="el-speed-val" style="margin-left: var(--nui-space-half)">1.00</span>
        </nui-input-group>

        <nui-input-group>
            <nui-input>
                <input type="checkbox" id="el-batch">
                <label for="el-batch">Batch mode (full render — best quality, no streaming)</label>
            </nui-input>
        </nui-input-group>

        <nui-button-container gap="medium" data-generate-anchor>
            <nui-button variant="primary" id="btn-generate">
                <button type="button">Generate</button>
            </nui-button>
        </nui-button-container>

    </nui-card>
</div>

<script type="nui/page">
const mountGenerate = window.nspeechMountGenerate;

function init(element, params, nui) {
    const voiceSelect = element.querySelector('#el-voice-select');
    const selectEl = element.querySelector('#el-voice');
    const modelEl = element.querySelector('#el-model');
    const textArea = element.querySelector('#el-text');
    const stabilityEl = element.querySelector('#el-stability');
    const stabilityValEl = element.querySelector('#el-stability-val');
    const styleEl = element.querySelector('#el-style');
    const styleValEl = element.querySelector('#el-style-val');
    const similarityEl = element.querySelector('#el-similarity');
    const similarityValEl = element.querySelector('#el-similarity-val');
    const speedEl = element.querySelector('#el-speed');
    const speedValEl = element.querySelector('#el-speed-val');
    const batchEl = element.querySelector('#el-batch');
    const generateBtn = element.querySelector('#btn-generate');

    stabilityEl.addEventListener('input', function() { stabilityValEl.textContent = parseFloat(this.value).toFixed(2); });
    styleEl.addEventListener('input', function() { styleValEl.textContent = parseFloat(this.value).toFixed(2); });
    similarityEl.addEventListener('input', function() { similarityValEl.textContent = parseFloat(this.value).toFixed(2); });
    speedEl.addEventListener('input', function() { speedValEl.textContent = parseFloat(this.value).toFixed(2); });

    function loadVoices() {
        window.nspeech.client.listVoices('elevenlabs', null, true)
            .then(function(d) {
                var voices = d.voices || [];
                var cloned = [], langMap = {};
                for (var i = 0; i < voices.length; i++) {
                    var v = voices[i];
                    if (v.category === 'cloned') {
                        cloned.push({ value: v.voice_id, label: '\u2605 ' + v.name });
                        continue;
                    }
                    var lang = (v.language || 'ZZ').toUpperCase();
                    if (!langMap[lang]) langMap[lang] = [];
                    langMap[lang].push({ value: v.voice_id, label: v.name });
                }
                var groups = [];
                if (cloned.length) groups.push({ group: 'Cloned', options: cloned });
                var langKeys = Object.keys(langMap).sort(function(a, b) { return a === 'EN' ? -1 : b === 'EN' ? 1 : a.localeCompare(b); });
                for (var k = 0; k < langKeys.length; k++) {
                    groups.push({ group: langKeys[k], options: langMap[langKeys[k]] });
                }
                voiceSelect.setItems(groups);
                if (selectEl.options.length <= 1 && cloned.length > 0) selectEl.value = cloned[0].value;
                else if (selectEl.options.length <= 1 && groups.length > 0) {
                    var en = groups.find(function(g) { return g.group === 'EN'; }) || groups[0];
                    if (en.options.length > 0) selectEl.value = en.options[0].value;
                }
            })
            .catch(function() {});
    }

    // ── Generate via the shared widget (player + progress) ─────────────
    const widget = mountGenerate(element, {
        filename: 'elevenlabs-speech.mp3',
        buildParams: () => {
            const text = textArea.value.trim();
            if (!text) return null;
            const eb = {
                model: modelEl.value,
                stability: parseFloat(stabilityEl.value),
                expressiveness: parseFloat(styleEl.value),
                guidance_scale: parseFloat(similarityEl.value),
                language: 'en',
                batch: batchEl.checked,
            };
            return {
                model: 'elevenlabs',
                input: text,
                voice: selectEl.value || 'default',
                speed: parseFloat(speedEl.value),
                extraBody: eb,
            };
        },
    });

    generateBtn.querySelector('button').addEventListener('click', () => widget.generate());

    element.show = function() { loadVoices(); };
    element.hide = function() { widget.stop(); };
}
</script>
