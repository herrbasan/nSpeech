<div class="page-minimax-generate">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>MiniMax — Generate</h1>
        <p class="lead">Cloud TTS with 332+ voices across 13 languages. <code>speech-2.8-turbo</code> by default.</p>
    </header>

    <nui-card>
        <nui-input-group>
            <label for="mm-model">Model</label>
            <nui-select id="mm-model-select">
                <select id="mm-model">
                    <option value="" disabled selected>Loading models...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="mm-voice">Voice</label>
            <nui-select id="mm-voice-select">
                <select id="mm-voice">
                    <option value="" disabled selected>Loading voices...</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="mm-text">Text</label>
            <nui-textarea auto-resize max-rows="8" min-rows="5">
                <textarea id="mm-text" placeholder="Text to synthesize...">This is a test of MiniMax cloud speech synthesis through nSpeech. All 332 system voices are available, covering English, Chinese, Japanese, Korean, Spanish, Portuguese, and many more.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-input-group>
            <label for="mm-speed">Speed</label>
            <nui-input type="range" min="0.5" max="2" step="0.1" value="1">
                <input type="range" id="mm-speed" min="0.5" max="2" step="0.1" value="1">
            </nui-input>
            <span id="mm-speed-val" style="margin-left: var(--nui-space-half)">1.0</span>
        </nui-input-group>

        <nui-input-group>
            <label for="mm-emotion">Emotion</label>
            <nui-select id="mm-emotion-select">
                <select id="mm-emotion">
                    <option value="">Auto (recommended)</option>
                    <option value="happy">Happy</option>
                    <option value="sad">Sad</option>
                    <option value="angry">Angry</option>
                    <option value="fearful">Fearful</option>
                    <option value="disgusted">Disgusted</option>
                    <option value="surprised">Surprised</option>
                    <option value="calm">Calm</option>
                    <option value="whisper">Whisper</option>
                </select>
            </nui-select>
        </nui-input-group>

        <nui-input-group>
            <nui-input>
                <input type="checkbox" id="mm-batch">
                <label for="mm-batch">Batch mode (full render — best quality, no streaming)</label>
            </nui-input>
        </nui-input-group>

        <nui-button-container gap="medium" data-generate-anchor>
            <nui-button variant="primary" id="btn-generate">
                <button type="button">Generate</button>
            </nui-button>
        </nui-button-container>

    </nui-card>
</div>

<script type="nui/page">
const mountGenerate = window.nspeechMountGenerate;

function init(element, params, nui) {
    const modelEl = element.querySelector('#mm-model');
    const voiceSelect = element.querySelector('#mm-voice-select');
    const selectEl = element.querySelector('#mm-voice');
    const textArea = element.querySelector('#mm-text');
    const speedEl = element.querySelector('#mm-speed');
    const speedValEl = element.querySelector('#mm-speed-val');
    const emotionEl = element.querySelector('#mm-emotion');
    const batchEl = element.querySelector('#mm-batch');
    const generateBtn = element.querySelector('#btn-generate');

    speedEl.addEventListener('input', () => {
        speedValEl.textContent = speedEl.value;
    });

    function loadVoices() {
        window.nspeech.client.listVoices('minimax')
            .then(d => {
                const voices = d.voices || [];
                const cloned = [];
                const langMap = {};
                for (const v of voices) {
                    if (v.category === 'cloned') {
                        cloned.push({ value: v.voice_id, label: `★ ${v.name}` });
                        continue;
                    }
                    const lang = (v.language || 'ZZ').toUpperCase();
                    if (!langMap[lang]) langMap[lang] = [];
                    langMap[lang].push({ value: v.voice_id, label: v.name });
                }
                const groups = [];
                if (cloned.length) groups.push({ group: 'Cloned', options: cloned });
                const langGroups = Object.entries(langMap)
                    .sort(([a], [b]) => a === 'EN' ? -1 : b === 'EN' ? 1 : a.localeCompare(b))
                    .map(([lang, options]) => ({ group: lang, options }));
                groups.push(...langGroups);
                voiceSelect.setItems(groups);
                if (selectEl.options.length <= 1 && cloned.length > 0) {
                    selectEl.value = cloned[0].value;
                } else if (selectEl.options.length <= 1 && groups.length > 0) {
                    const en = groups.find(g => g.group === 'EN') || groups[0];
                    if (en.options.length > 0) selectEl.value = en.options[0].value;
                }
            })
            .catch(() => {});
    }

    // ── Generate via the shared widget (player + progress) ─────────────
    const widget = mountGenerate(element, {
        filename: 'minimax-speech.mp3',
        buildParams: () => {
            const text = textArea.value.trim();
            if (!text) return null;
            const eb = { language: 'en' };
            if (emotionEl.value) eb.emotion = emotionEl.value;
            if (batchEl.checked) eb.batch = true;
            return {
                model: modelEl.value || 'minimax',
                input: text,
                voice: selectEl.value || 'default',
                speed: parseFloat(speedEl.value),
                extraBody: eb,
            };
        },
    });

    generateBtn.querySelector('button').addEventListener('click', () => widget.generate());
    window.nspeechSettings.init(element, "minimax");
    window.nspeechLoadModels(modelEl, 'minimax');

    element.show = () => loadVoices();
    element.hide = () => widget.stop();
}
</script>
