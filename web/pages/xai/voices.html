<div class="page-xai-voices">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>xAI / Grok — Voice Presets</h1>
        <p class="lead">Combine an xAI voice with instructions to create a reusable character preset.</p>
    </header>

    <nui-card>
        <h3 style="margin-top: 0">Create Preset</h3>
        <p class="lead" style="margin-bottom: var(--nui-space)">Choose a base voice and write instructions that define how it speaks.</p>

        <nui-input-group>
            <label for="xai-preset-name">Preset Name</label>
            <nui-input><input type="text" id="xai-preset-name" placeholder="Smart Lady"></nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="xai-preset-id">ID (URL-safe slug)</label>
            <nui-input><input type="text" id="xai-preset-id" placeholder="smart-lady"></nui-input>
        </nui-input-group>

        <nui-input-group>
            <label for="xai-preset-voice">Base Voice</label>
            <nui-select id="xai-preset-voice-select"><select id="xai-preset-voice"><option value="">Loading...</option></select></nui-select>
        </nui-input-group>

        <nui-input-group>
            <label for="xai-preset-instructions">Instructions</label>
            <nui-textarea min-rows="2" max-rows="4">
                <textarea id="xai-preset-instructions" placeholder="Speak in the cadence of a public intellectual.">Speak clearly and warmly, with a natural conversational flow.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-input-group>
            <label for="xai-preset-test-phrase">Test Phrase</label>
            <nui-textarea min-rows="1" max-rows="3">
                <textarea id="xai-preset-test-phrase" placeholder="This is a preview of the selected voice.">Hello, this is a preview of my voice. I hope you enjoy the sound of it.</textarea>
            </nui-textarea>
        </nui-input-group>

        <nui-button-container gap="medium">
            <nui-button variant="primary" id="btn-xai-save-preset"><button type="button">Save Preset</button></nui-button>
            <nui-button id="btn-xai-preview-preset"><button type="button">Preview</button></nui-button>
        </nui-button-container>

        <div id="xai-preset-status" style="margin-top: var(--nui-space);"></div>
    </nui-card>

    <nui-card>
        <h3 style="margin-top: 0">Your Presets</h3>
        <div id="xai-preset-list"><p style="color: var(--color-shade6)">Loading...</p></div>
    </nui-card>

    <audio id="xai-preset-audio" controls style="width: 100%; margin-top: var(--nui-space); display: none;"></audio>
</div>
<script type="nui/page">
import { NSpeechClient } from "/lib/nspeech-client/nspeech-client.js";

function init(element, params, nui) {
    const ENGINE = "xai";
    const nspeech = new NSpeechClient();
    let abortController = null;
    let mediaSource = null;
    let audioEl = element.querySelector("#xai-preset-audio");

    const presetListEl = element.querySelector("#xai-preset-list");
    const statusEl = element.querySelector("#xai-preset-status");
    const voiceSelect = element.querySelector("#xai-preset-voice-select");
    const voiceSelectEl = element.querySelector("#xai-preset-voice");
    const nameInput = element.querySelector("#xai-preset-name");
    const idInput = element.querySelector("#xai-preset-id");
    const instructionsInput = element.querySelector("#xai-preset-instructions");
    const testPhraseEl = element.querySelector("#xai-preset-test-phrase");
    let allVoices = [];

    function loadAll() {
        nspeech.listVoices("xai").then(function(d) {
            allVoices = d.voices || [];
            populateDropdown();
            loadPresets();
        }).catch(function(err) {
            presetListEl.innerHTML = '<p style="color:var(--color-danger)">Failed: ' + err.message + '</p>';
        });
    }

    function populateDropdown() {
        const options = [];
        for (const v of allVoices) {
            if (v.voice_type !== "preset") {
                options.push({ value: v.voice_id, label: v.name + " \u2014 " + (v.description || "") });
            }
        }
        voiceSelect.setItems([{ group: "xAI Voices", options: options }]);
    }

    function loadPresets() {
        const presets = allVoices.filter(function(v) { return v.voice_type === "preset"; });
        if (!presets.length) {
            presetListEl.innerHTML = '<p style="color: var(--color-shade6);">No presets yet.</p>';
            return;
        }
        let html = '<div style="display: grid; gap: var(--nui-space-half);">';
        for (const p of presets) {
            html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--nui-space-half);border:1px solid var(--border-shade1-4);border-radius:var(--border-radius1-3);">' +
                '<div><strong>' + p.name + '</strong> <code style="font-size:0.85em;">' + p.voice_id + '</code><br>' +
                '<span style="color:var(--color-shade6);font-size:0.85em;">voice: <code>' + p.base_voice + '</code>' + (p.instructions ? ' \u2014 ' + p.instructions.slice(0, 50) + '\u2026' : '') + '</span></div>' +
                '<div style="display:flex;gap:var(--nui-space-half);">' +
                '<nui-button data-preview-preset="' + p.voice_id + '"><button type="button">Preview</button></nui-button>' +
                '<nui-button variant="danger" data-delete-preset="' + p.voice_id + '"><button type="button">Delete</button></nui-button>' +
                '</div></div>';
        }
        html += '</div>';
        presetListEl.innerHTML = html;

        for (const el of presetListEl.querySelectorAll("[data-preview-preset]")) {
            const id = el.dataset.previewPreset;
            el.querySelector("button").addEventListener("click", function() { previewPreset(id); });
        }
        for (const el of presetListEl.querySelectorAll("[data-delete-preset]")) {
            const id = el.dataset.deletePreset;
            el.querySelector("button").addEventListener("click", function() { deletePreset(id); });
        }
    }

    function stop() {
        if (abortController) { abortController.abort(); abortController = null; }
        if (audioEl) { audioEl.pause(); audioEl.src = ""; }
        if (mediaSource && mediaSource.readyState === "open") { try { mediaSource.endOfStream(); } catch (_) {} }
        mediaSource = null;
    }

    function previewCurrent() {
        const text = testPhraseEl.value.trim() || "This is a preview of the selected voice.";
        const voice = voiceSelectEl.value;
        const instructions = instructionsInput.value.trim();
        if (!voice) { statusEl.innerHTML = '<span style="color:var(--color-danger);">Select a base voice first.</span>'; return; }
        stop();
        abortController = new AbortController();
        const newAudio = document.createElement("audio");
        newAudio.controls = true;
        newAudio.style.cssText = "width: 100%; margin-top: var(--nui-space); display: block;";
        if (audioEl.parentNode) audioEl.replaceWith(newAudio);
        audioEl = newAudio;
        mediaSource = new MediaSource();
        audioEl.src = URL.createObjectURL(mediaSource);
        statusEl.innerHTML = '<span style="color:var(--color-shade6);">Previewing...</span>';

        mediaSource.addEventListener("sourceopen", function() {
            const sb = mediaSource.addSourceBuffer("audio/mpeg");
            const queue = [];
            let appending = false;
            let ended = false;
            function tryPlay() { if (!audioEl.paused || sb.buffered.length === 0) return; audioEl.play().catch(function() {}); }
            function pumpQueue() {
                if (appending || queue.length === 0) { if (ended && !appending && mediaSource.readyState === "open") { mediaSource.endOfStream(); statusEl.innerHTML = ""; } return; }
                appending = true; sb.appendBuffer(queue.shift());
                sb.addEventListener("updateend", function() { appending = false; tryPlay(); pumpQueue(); }, { once: true });
            }
            nspeech.speech({ model: ENGINE, input: text, voice: voice, format: "mp3", instructions: instructions, signal: abortController.signal }).then(function(res) {
                return res.body.getReader();
            }).then(function(reader) {
                function readLoop() { reader.read().then(function(result) { if (result.done) { ended = true; pumpQueue(); return; } queue.push(result.value); pumpQueue(); readLoop(); }); }
                readLoop();
            }).catch(function(err) { if (err.name !== "AbortError") statusEl.innerHTML = '<span style="color:var(--color-danger);">Preview failed: ' + err.message + '</span>'; });
        }, { once: true });
    }

    function previewPreset(id) {
        const preset = allVoices.find(function(v) { return v.voice_id === id && v.voice_type === "preset"; });
        if (!preset) return;
        stop();
        abortController = new AbortController();
        const newAudio = document.createElement("audio");
        newAudio.controls = true;
        newAudio.style.cssText = "width: 100%; margin-top: var(--nui-space); display: block;";
        if (audioEl.parentNode) audioEl.replaceWith(newAudio);
        audioEl = newAudio;
        mediaSource = new MediaSource();
        audioEl.src = URL.createObjectURL(mediaSource);
        statusEl.innerHTML = '<span style="color:var(--color-shade6);">Playing preset: ' + preset.name + '</span>';
        nspeech.speech({ model: ENGINE, input: preset.name + ". This is a preset preview.", voice: id, format: "mp3", signal: abortController.signal }).then(function(res) {
            const result = playSpeechStream(res, audioEl, function(info) { if (info.status === "done") statusEl.innerHTML = ""; });
            audioEl = result.audio;
        }).catch(function(err) { if (err.name !== "AbortError") statusEl.innerHTML = '<span style="color:var(--color-danger);">Preview failed: ' + err.message + '</span>'; });
    }

    function deletePreset(id) {
        nspeech.deletePreset("xai", id).then(function() {
            statusEl.innerHTML = '<span style="color:var(--color-highlight);">Preset deleted.</span>';
            loadAll();
        }).catch(function(err) {
            statusEl.innerHTML = '<span style="color:var(--color-danger);">Delete failed: ' + err.message + '</span>';
        });
    }

    function savePreset() {
        const id = idInput.value.trim();
        const name = nameInput.value.trim();
        const voice = voiceSelectEl.value;
        const instructions = instructionsInput.value.trim();
        if (!name || !id || !voice) {
            statusEl.innerHTML = '<span style="color:var(--color-danger);">Name, ID, and base voice are required.</span>';
            return;
        }
        statusEl.innerHTML = '<span style="color:var(--color-shade6);">Saving...</span>';
        nspeech.createPreset({ engine: ENGINE, id: id, name: name, voice: voice, instructions: instructions }).then(function() {
            statusEl.innerHTML = '<span style="color:var(--color-highlight);">Preset saved!</span>';
            nameInput.value = ""; idInput.value = ""; instructionsInput.value = ""; voiceSelectEl.selectedIndex = 0;
            loadAll();
        }).catch(function(err) {
            statusEl.innerHTML = '<span style="color:var(--color-danger);">Save failed: ' + err.message + '</span>';
        });
    }

    element.querySelector("#btn-xai-save-preset button").addEventListener("click", savePreset);
    element.querySelector("#btn-xai-preview-preset button").addEventListener("click", previewCurrent);
    element.show = function() { loadAll(); };
}
</script>
